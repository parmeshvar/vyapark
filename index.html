<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vyapark - Local Marketplace</title>
    <!-- PWA / Offline Mode -->
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app-container">
        <!-- Header -->
        <header class="app-header glassmorphism">
            <div class="header-brand" style="text-align:center; border-bottom: 1px solid rgba(0,0,0,0.05); overflow: hidden; height: 100px; display: flex; align-items: center; justify-content: center;">
                <img src="logo.png" alt="Vyapark" style="height: 150px; object-fit: contain;">
            </div>
            <div class="header-top mt-2">
                <div class="location-selector">
                    <i class="fa-solid fa-location-dot text-primary"></i>
                    <div class="location-text">
                        <span class="label" id="lang-delivering">Delivering to</span>
                        <span class="current-location">Connaught Place, Delhi <i class="fa-solid fa-chevron-down"></i></span>
                    </div>
                </div>
                <div class="header-actions">
                    <!-- Multi-language Switcher -->
                    <select id="lang-switcher" class="lang-select" onchange="changeLanguage(this.value)">
                        <option value="en">English</option>
                        <option value="hi">हिंदी</option>
                        <option value="gu">ગુજરાતી</option>
                    </select>
                    <button class="icon-btn profile-btn" id="profile-nav-btn" onclick="window.location.href='profile.html'"><img id="profile-nav-img" src="https://ui-avatars.com/api/?name=User&background=random" alt="Profile"></button>
                </div>
            </div>
            
            <div class="search-bar" style="position:relative;">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="lang-search-placeholder" placeholder="Search products, sellers or categories...">
                <button class="voice-search"><i class="fa-solid fa-microphone"></i></button>
                
                <!-- Search Results Dropdown -->
                <div id="search-dropdown" class="search-dropdown" style="display:none;">
                    <!-- Dynamic Search Results -->
                </div>
            </div>
            
            <!-- Saved Searches -->
            <div class="saved-searches mt-2">
                <span class="saved-tag"><i class="fa-solid fa-clock-rotate-left"></i> Smart Watch</span>
                <span class="saved-tag"><i class="fa-solid fa-clock-rotate-left"></i> Organic Apples</span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="app-main">
            <!-- Main Categories Toggle -->
            <div class="main-type-toggle">
                <button class="type-btn active" id="btn-products" onclick="switchMainType('products')">
                    <i class="fa-solid fa-box-open"></i> <span data-lang="products">Products</span>
                </button>
                <button class="type-btn" id="btn-services" onclick="switchMainType('services')">
                    <i class="fa-solid fa-user-tie"></i> <span data-lang="services">Services</span>
                </button>
            </div>

            <!-- Sub Categories -->
            <section class="categories-section mt-3">
                <div class="categories-scroll" id="sub-categories-container">
                    <!-- Dynamic from JS -->
                </div>
            </section>
            
            <!-- Locality Feed (Mohalle ke trending products) -->
            <section class="locality-feed">
                <div class="section-header">
                    <h2 class="section-title"><i class="fa-solid fa-fire text-danger"></i> <span id="lang-trending">Trending in your Mohalla</span></h2>
                </div>
                <div class="trending-scroll" id="trending-container">
                    <!-- Dynamic from JS -->
                </div>
            </section>

            <!-- Map View Banner -->
            <div class="map-banner">
                <div class="map-banner-content">
                    <h3 id="lang-map-title">Find sellers near you!</h3>
                    <p id="lang-map-desc">Use map view to explore</p>
                    <button class="btn-primary-small" onclick="window.location.href='map.html'"><i class="fa-solid fa-map"></i> <span id="lang-map-btn">Open Map</span></button>
                </div>
                <div class="map-banner-bg"></div>
            </div>

            <!-- Near Me Products -->
            <section class="products-section">
                <div class="section-header" style="align-items:center;">
                    <h2 class="section-title" id="lang-near-you" style="margin:0;">Near You (5km)</h2>
                    <div style="display:flex; gap:8px;">
                        <button class="btn-outline-small" onclick="toggleFilterModal()"><i class="fa-solid fa-arrow-down-wide-short"></i> Sort</button>
                        <button class="btn-outline-small" onclick="toggleFilterModal()"><i class="fa-solid fa-filter"></i> Filter</button>
                    </div>
                </div>
                <div class="products-grid" id="products-container">
                    <!-- Dynamic from JS -->
                </div>
            </section>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav glassmorphism">
            <a href="#" class="nav-item active">
                <i class="fa-solid fa-house"></i>
                <span id="lang-nav-home">Home</span>
            </a>
            <a href="map.html" class="nav-item">
                <i class="fa-solid fa-map-location-dot"></i>
                <span id="lang-nav-map">Map</span>
            </a>
            <a href="seller.html" class="nav-item">
                <i class="fa-solid fa-circle-plus nav-add"></i>
                <span id="lang-nav-sell">Sell</span>
            </a>
            <a href="chats.html" class="nav-item">
                <i class="fa-regular fa-comment-dots"></i>
                <span id="lang-nav-chats">Chats</span>
            </a>
            <a href="cart.html" class="nav-item">
                <div style="position:relative;">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="nav-badge" id="cart-count-badge" style="display:none;">0</span>
                </div>
                <span id="lang-nav-cart">Cart</span>
            </a>
        </nav>

        <!-- Filter & Sort Bottom Sheet -->
        <div id="filter-modal" class="bottom-sheet">
            <div class="bottom-sheet-content">
                <div class="sheet-header">
                    <h3>Sort & Filter</h3>
                    <button class="icon-btn-circle" onclick="toggleFilterModal()" style="width:32px; height:32px;"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="sheet-body">
                    <h4>Sort By</h4>
                    <div class="filter-options">
                        <label class="filter-radio"><input type="radio" name="sort" checked> Relevance</label>
                        <label class="filter-radio"><input type="radio" name="sort"> Price: Low to High</label>
                        <label class="filter-radio"><input type="radio" name="sort"> Price: High to Low</label>
                        <label class="filter-radio"><input type="radio" name="sort"> Rating: High to Low</label>
                        <label class="filter-radio"><input type="radio" name="sort"> Distance: Nearest First</label>
                    </div>

                    <h4 class="mt-3">Filter By</h4>
                    <div class="filter-options">
                        <label class="filter-radio"><input type="checkbox"> Verified Sellers Only</label>
                        <label class="filter-radio"><input type="checkbox"> Cash on Delivery</label>
                        <label class="filter-radio"><input type="checkbox"> Free Delivery</label>
                    </div>

                    <h4 class="mt-3">Max Price Range</h4>
                    <input type="range" min="0" max="10000" value="5000" class="w-100" style="accent-color:var(--primary);" oninput="document.getElementById('price-val').innerText='₹' + this.value">
                    <div style="text-align:right; font-size:12px; font-weight:bold; color:var(--primary);" id="price-val">₹5000</div>
                    
                    <button class="btn-primary w-100 mt-3" onclick="applyFilters()">Apply Filters</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Auth state check & profile avatar update
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                let userId = localStorage.getItem('vyapark_user_id');
                const { data: { session } } = await supabase.auth.getSession();
                if (session) userId = session.user.id;
                
                if (userId) {
                    let profile = null;
                    const { data } = await supabase
                        .from('profiles')
                        .select('full_name, role')
                        .eq('id', userId)
                        .maybeSingle();
                    if (data) profile = data;
                    else {
                        try {
                            const local = JSON.parse(localStorage.getItem('vyapark_local_profile'));
                            if (local && local.id === userId) profile = local;
                        } catch(e) {}
                    }
                        
                    if (profile && profile.full_name) {
                        const img = document.querySelector('.profile-btn img');
                        if (img) img.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(profile.full_name)}&background=6366f1&color=fff`;
                    }
                }
            } catch(e) { /* silently fail */ }
        });

        // Register Service Worker for Offline Mode
        if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    console.log('SW registered for Offline Mode', reg);
                });
            });
        }
    </script>
</body>
</html>
