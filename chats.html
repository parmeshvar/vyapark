<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vyapark - Chats</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/chat.css">
</head>
<body>
    <div id="app-container">
        <!-- Header -->
        <header class="app-header glassmorphism">
            <div class="header-top">
                <button class="back-btn-small" onclick="window.location.href='index.html'"><i class="fa-solid fa-arrow-left"></i></button>
                <h2 style="font-size:20px; flex:1; margin-left:12px;">Messages</h2>
                <button class="icon-btn" style="width:36px; height:36px;"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            
            <div class="chat-tabs">
                <div class="chat-tab active">Buying (3)</div>
                <div class="chat-tab">Selling (1)</div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="app-main p-0">
            <div class="chat-list" id="chat-list">
                <!-- Dynamic Chat List from JS -->
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/chat.js"></script>
</body>
</html>
