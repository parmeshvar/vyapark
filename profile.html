<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vyapark - My Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/profile.css">
</head>
<body class="bg-light">
    <div id="app-container">
        <!-- Header -->
        <header class="app-header glassmorphism" style="position:sticky; top:0; z-index:100;">
            <div class="header-top" style="align-items:center;">
                <button class="back-btn-small" onclick="window.location.href='index.html'"><i class="fa-solid fa-arrow-left"></i></button>
                <h2 style="font-size:20px; flex:1; margin-left:12px;">My Profile</h2>
            </div>
        </header>

        <main class="profile-main p-3" style="padding-bottom: 90px;">
            <!-- Profile Header -->
            <div class="profile-card">
                <div class="pc-avatar-wrapper">
                    <img id="profile-avatar" src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff&size=100" alt="User" class="pc-avatar">
                    <button class="pc-edit-img"><i class="fa-solid fa-camera"></i></button>
                </div>
                <div class="pc-details">
                    <h3 id="profile-name-display">Loading...</h3>
                    <p id="profile-phone-display"></p>
                    <span id="profile-role-badge" style="display:inline-block; margin-top:6px; font-size:11px; padding:3px 10px; border-radius:20px; background:var(--primary); color:white; font-weight:600;"></span>
                    <button class="btn-outline-small mt-2" style="border-radius:20px; font-size:12px; display:block;" onclick="window.location.href='auth.html'">Edit Profile</button>
                </div>
            </div>

            <!-- Profile Menu -->
            <div class="profile-menu">
                <a href="#" class="menu-item">
                    <div class="mi-icon bg-blue-light"><i class="fa-solid fa-box-open text-primary"></i></div>
                    <div class="mi-text">
                        <h4>My Orders</h4>
                        <p>Track your recent orders</p>
                    </div>
                    <i class="fa-solid fa-chevron-right text-muted"></i>
                </a>

                <a href="#" class="menu-item">
                    <div class="mi-icon bg-pink-light"><i class="fa-solid fa-heart text-secondary"></i></div>
                    <div class="mi-text">
                        <h4>Saved Products</h4>
                        <p>Your wishlist & favorites</p>
                    </div>
                    <i class="fa-solid fa-chevron-right text-muted"></i>
                </a>

                <a href="#" class="menu-item">
                    <div class="mi-icon bg-green-light"><i class="fa-solid fa-location-dot text-success"></i></div>
                    <div class="mi-text">
                        <h4>Saved Addresses</h4>
                        <p>Home, Office</p>
                    </div>
                    <i class="fa-solid fa-chevron-right text-muted"></i>
                </a>
            </div>

            <div class="profile-menu mt-3">
                <a href="seller.html" class="menu-item become-seller-card">
                    <div class="mi-icon bg-orange-light"><i class="fa-solid fa-shop text-warning"></i></div>
                    <div class="mi-text">
                        <h4>Become a Seller</h4>
                        <p class="text-primary" style="font-weight:600;">Start selling on Vyapark!</p>
                    </div>
                    <i class="fa-solid fa-chevron-right text-primary"></i>
                </a>
            </div>

            <div class="profile-menu mt-3">
                <a href="#" class="menu-item">
                    <div class="mi-icon bg-gray-light"><i class="fa-solid fa-headset text-main"></i></div>
                    <div class="mi-text">
                        <h4>Help & Support</h4>
                        <p>Contact customer care</p>
                    </div>
                    <i class="fa-solid fa-chevron-right text-muted"></i>
                </a>
                
                <a href="auth.html" class="menu-item text-danger" id="logout-btn" onclick="doLogout(event)">
                    <div class="mi-icon bg-red-light"><i class="fa-solid fa-arrow-right-from-bracket text-danger"></i></div>
                    <div class="mi-text">
                        <h4 class="text-danger">Logout</h4>
                    </div>
                </a>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                let userId = localStorage.getItem('vyapark_user_id');
                const { data: { session } } = await supabase.auth.getSession();
                if (session) userId = session.user.id;
                
                if (!userId) {
                    window.location.href = 'auth.html';
                    return;
                }
                
                let profile = null;
                const { data } = await supabase
                    .from('profiles')
                    .select('*')
                    .eq('id', userId)
                    .maybeSingle();

                if (data) profile = data;
                else {
                    try {
                        const local = JSON.parse(localStorage.getItem('vyapark_local_profile'));
                        if (local && local.id === userId) profile = local;
                    } catch(e) {}
                }

                if (profile) {
                    const name = profile.full_name || 'Vyapark User';
                    document.getElementById('profile-name-display').innerText = name;
                    // Phone logic removed since we use email now, can leave blank or use role
                    document.getElementById('profile-phone-display').innerText = profile.phone ? '+91 ' + profile.phone : '';
                    document.getElementById('profile-avatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=6366f1&color=fff&size=100`;
                    const roleBadge = document.getElementById('profile-role-badge');
                    roleBadge.innerText = (profile.role || 'buyer').toUpperCase();
                }
            } catch (e) {
                console.error('Profile load error:', e);
            }
        });

        async function doLogout(e) {
            e.preventDefault();
            await supabase.auth.signOut();
            localStorage.removeItem('vyapark_user_id');
            localStorage.removeItem('vyapark_user_role');
            localStorage.removeItem('vyapark_local_profile');
            window.location.href = 'auth.html';
        }
    </script>
</body>
</html>
